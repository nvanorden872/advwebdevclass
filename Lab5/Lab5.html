
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Open Library API</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <main class="container">
        <h1>Open Library: Data Analysis Books</h1>
        <p>Below are 10 books retrieved from the Open Library API.</p>

        <div id="results">Loading books...</div>
    </main>

    <script>
        const apiURL =
            "https://openlibrary.org/search.json?q=data%20analysis&limit=10";

        fetch(apiURL)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to retrieve books.");
                }
                return response.json();
            })
            .then(data => {
                const results = document.getElementById("results");
                results.innerHTML = "";

                data.docs.forEach(book => {
                    const bookDiv = document.createElement("div");
                    bookDiv.className = "box";

                    const title = document.createElement("h3");
                    title.textContent = book.title || "Title unavailable";

                    const year = document.createElement("p");
                    year.className = "year";
                    year.textContent =
                        "First Publication Year: " +
                        (book.first_publish_year ?? "Year unavailable");

                    bookDiv.appendChild(title);
                    bookDiv.appendChild(year);
                    results.appendChild(bookDiv);
                });

                if (data.docs.length === 0) {
                    results.textContent = "No books were found.";
                }
            })
            .catch(error => {
                document.getElementById("results").textContent =
                    "There was an error loading the books. Please try again.";
                console.error(error);
            });
    </script>
</body>
</html>
