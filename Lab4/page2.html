
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Album Photos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <a href="lab4.html">← Back to Albums</a>

        <h1>Album Information</h1>
        <div id="album">Loading album...</div>

        <h2>Photos</h2>
        <div id="photos" class="photo-grid">
            Loading photos...
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const albumId = params.get("albumId");

        async function loadAlbum() {
            const albumDiv = document.getElementById("album");
            const photosDiv = document.getElementById("photos");

            if (!albumId || !/^\d+$/.test(albumId)) {
                albumDiv.textContent = "Please select a valid album.";
                photosDiv.textContent = "";
                return;
            }

            try {
                const albumResponse = await fetch(
                    `https://jsonplaceholder.typicode.com/albums/${albumId}`
                );

                if (!albumResponse.ok) {
                    throw new Error("Album not found");
                }

                const album = await albumResponse.json();

                albumDiv.innerHTML = `
                    <div class="user-card">
                        <p><strong>Album ID:</strong> ${album.id}</p>
                        <p><strong>User ID:</strong> ${album.userId}</p>
                        <p><strong>Title:</strong> ${album.title}</p>
                    </div>
                `;

                const photoResponse = await fetch(
                    `https://jsonplaceholder.typicode.com/photos?albumId=${albumId}`
                );

                if (!photoResponse.ok) {
                    throw new Error("Unable to load photos");
                }

                const photos = await photoResponse.json();
                photosDiv.innerHTML = "";

                photos.forEach(photo => {
                    const card = document.createElement("div");
                    card.className = "photo-card";

                    const image = document.createElement("img");
                    image.src = photo.thumbnailUrl;
                    image.alt = photo.title;
                    image.loading = "lazy";

                    const title = document.createElement("p");
                    title.textContent = photo.title;

                    card.appendChild(image);
                    card.appendChild(title);
                    photosDiv.appendChild(card);
                });
            } catch (error) {
                albumDiv.textContent = "Unable to load album information.";
                photosDiv.textContent = "Unable to load photos.";
            }
        }

        loadAlbum();
    </script>
</body>
</html>
