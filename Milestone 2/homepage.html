
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFinder | Home</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header class="site-header">
        <nav>
            <a href="../index.html">Home</a>
            <a href="bookshelf.html">My Bookshelf</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">OPEN LIBRARY EXPLORER</p>
            <h1>Find your next favorite book.</h1>
            <p>Search books and explore their details using Open Library.</p>

            <form id="searchForm">
                <input id="searchInput" type="search"
                    placeholder="Enter a title, author, or keyword"
                    aria-label="Book search" required>
                <button type="submit">Search</button>
            </form>
        </section>

        <section>
            <div class="results-heading">
                <h2>Search Results</h2>
                <label>
                    Results per page:
                    <select id="limitSelect">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="60">60</option>
                    </select>
                </label>
            </div>

            <p id="status" role="status">Enter a search term to begin.</p>
            <div id="results" class="book-grid"></div>

            <div class="pagination">
                <button id="previousBtn" type="button" disabled>
                    Previous
                </button>

                <label>
                    Page:
                    <select id="pageSelect" disabled>
                        <option value="1">1</option>
                    </select>
                </label>

                <button id="nextBtn" type="button" disabled>
                    Next
                </button>
            </div>
        </section>
    </main>

    <footer>BookFinder · Powered by Open Library</footer>

    <script>
        const form = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const limitSelect = document.getElementById("limitSelect");
        const pageSelect = document.getElementById("pageSelect");
        const resultsDiv = document.getElementById("results");
        const status = document.getElementById("status");
        const previousBtn = document.getElementById("previousBtn");
        const nextBtn = document.getElementById("nextBtn");

        let searchTerm = "";
        let currentPage = 1;
        let totalPages = 1;
        let requestNumber = 0;

        form.addEventListener("submit", event => {
            event.preventDefault();

            const term = searchInput.value.trim();

            if (!term) {
                status.textContent = "Please enter a search term.";
                return;
            }

            searchTerm = term;
            currentPage = 1;
            searchBooks();
        });

        limitSelect.addEventListener("change", () => {
            currentPage = 1;
            if (searchTerm) searchBooks();
        });

        pageSelect.addEventListener("change", () => {
            currentPage = Number(pageSelect.value);
            searchBooks();
        });

        previousBtn.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                searchBooks();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (currentPage < totalPages) {
                currentPage++;
                searchBooks();
            }
        });

        async function searchBooks() {
            const thisRequest = ++requestNumber;
            const limit = Number(limitSelect.value);

            status.textContent = "Loading books...";
            resultsDiv.replaceChildren();
            previousBtn.disabled = true;
            nextBtn.disabled = true;
            pageSelect.disabled = true;

            try {
                const url =
                    "https://openlibrary.org/search.json?q=" +
                    encodeURIComponent(searchTerm) +
                    "&limit=" + limit +
                    "&page=" + currentPage;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("The API request failed.");
                }

                const data = await response.json();

                // Ignore an older request if a newer search has started.
                if (thisRequest !== requestNumber) return;

                const books = data.docs || [];
                const totalFound = Number(
                    data.numFound ?? data.num_found ?? books.length
                );

                // The project displays a maximum of 60 results per search.
                const cappedTotal = Math.min(totalFound, 60);
                totalPages = Math.max(1, Math.ceil(cappedTotal / limit));

                if (currentPage > totalPages) {
                    currentPage = totalPages;
                    return searchBooks();
                }

                if (books.length === 0) {
                    status.textContent =
                        "No books found. Try another search term.";
                    updatePagination();
                    return;
                }

                // Do not show results beyond the first 60.
                const startIndex = (currentPage - 1) * limit;
                const visibleBooks = books.slice(
                    0, Math.max(0, Math.min(limit, 60 - startIndex))
                );

                visibleBooks.forEach(book => {
                    const card = document.createElement("article");
                    card.className = "book-card";

                    const cover = document.createElement("img");
                    cover.className = "book-cover";
                    cover.alt = "Cover of " + (book.title || "Untitled");
                    cover.loading = "lazy";
                    cover.src = book.cover_i
                        ? `https://covers.openlibrary.org/b/id/${book.cover_i}-S.jpg`
                        : "https://placehold.co/120x180/f0ece4/555?text=No+Cover";

                    const info = document.createElement("div");
                    info.className = "book-info";

                    const title = document.createElement("a");
                    title.className = "book-title";
                    title.textContent = book.title || "Title unavailable";

                    const workId = (book.key || "").replace(/^\/works\//, "");

                    if (workId && /^OL\d+W$/.test(workId)) {
                        title.href =
                            "details.html?workId=" + encodeURIComponent(workId);
                    } else {
                        title.removeAttribute("href");
                        title.classList.add("unavailable-link");
                    }

                    const author = document.createElement("p");
                    author.textContent = "Author: " +
                        (book.author_name?.join(", ") || "Unknown");

                    const year = document.createElement("p");
                    year.textContent = "First published: " +
                        (book.first_publish_year ?? "Year unavailable");

                    info.append(title, author, year);
                    card.append(cover, info);
                    resultsDiv.append(card);
                });

                status.textContent =
                    `Showing ${startIndex + 1}–${startIndex + visibleBooks.length}` +
                    ` of up to ${cappedTotal} matching books.`;

                updatePagination();
            } catch (error) {
                if (thisRequest !== requestNumber) return;
                status.textContent =
                    "Unable to load books. Check your connection and try again.";
                updatePagination();
                console.error(error);
            }
        }

        function updatePagination() {
            pageSelect.replaceChildren();

            for (let page = 1; page <= totalPages; page++) {
                const option = document.createElement("option");
                option.value = page;
                option.textContent = page;
                pageSelect.append(option);
            }

            pageSelect.value = String(currentPage);
            pageSelect.disabled = !searchTerm || totalPages <= 1;
            previousBtn.disabled = !searchTerm || currentPage <= 1;
            nextBtn.disabled = !searchTerm || currentPage >= totalPages;
        }
    </script>
</body>
</html>
