<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Library Search Results</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .book {
            background-color: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .cover {
            width: 160px;
        }

        .cover img {
            max-width: 160px;
            max-height: 230px;
        }

        .info {
            flex: 1;
            min-width: 300px;
        }

        .info h2 {
            margin-top: 0;
        }

        .info p {
            line-height: 1.5;
        }

        .label {
            font-weight: bold;
        }

        a {
            color: #0645ad;
        }

        .summary {
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Open Library Search Results</h1>

    <div id="summary" class="summary">
        Loading search results...
    </div>

    <div id="results"></div>

</div>

<script>
$(document).ready(function() {

    $.getJSON("openlibrary-search.json", function(data) {

        let books = data.docs || [];

        $("#summary").html(
            "<p><strong>Search phrase:</strong> " +
            (data.q || "modern web") +
            "</p>" +

            "<p><strong>Books displayed:</strong> " +
            books.length +
            "</p>"
        );

        books.forEach(function(book) {

            let title = book.title || "Title not available";

            let authors = "Not available";

            if (book.author_name &&
                book.author_name.length > 0) {

                authors = book.author_name.join(", ");
            }

            let year = book.first_publish_year ||
                       "Not available";

            let editionCount = book.edition_count ||
                               "Not available";

            let publishers = "Not available";

            if (book.publisher &&
                book.publisher.length > 0) {

                publishers =
                    book.publisher.slice(0, 5).join(", ");
            }

            let isbn = "Not available";

            if (book.isbn &&
                book.isbn.length > 0) {

                isbn =
                    book.isbn.slice(0, 5).join(", ");
            }

            let languages = "Not available";

            if (book.language &&
                book.language.length > 0) {

                languages = book.language.join(", ");
            }

            let ebook = "Not available";

            if (book.ebook_access) {
                ebook = book.ebook_access;
            }

            let fullText = "Not available";

            if (book.has_fulltext === true) {
                fullText = "Available";
            } else if (book.has_fulltext === false) {
                fullText = "Not available";
            }

            let coverHtml = "";

            if (book.cover_i) {

                let coverUrl =
                    "https://covers.openlibrary.org/b/id/" +
                    book.cover_i +
                    "-M.jpg";

                coverHtml =
                    '<img src="' +
                    coverUrl +
                    '" alt="Cover of ' +
                    title.replace(/"/g, "&quot;") +
                    '">';

            } else {

                coverHtml =
                    "<p>Cover image not available.</p>";
            }

            let bookUrl = "https://openlibrary.org";

            if (book.key) {
                bookUrl += book.key;
            }

            let bookHtml =

                '<div class="book">' +

                    '<div class="cover">' +
                        coverHtml +
                    '</div>' +

                    '<div class="info">' +

                        '<h2>' +
                            title +
                        '</h2>' +

                        '<p>' +
                            '<span class="label">' +
                            'Author(s):</span> ' +
                            authors +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'First Published:</span> ' +
                            year +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'Edition Count:</span> ' +
                            editionCount +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'Publisher(s):</span> ' +
                            publishers +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'ISBN:</span> ' +
                            isbn +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'Language(s):</span> ' +
                            languages +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'eBook Access:</span> ' +
                            ebook +
                        '</p>' +

                        '<p>' +
                            '<span class="label">' +
                            'Full Text:</span> ' +
                            fullText +
                        '</p>' +

                        '<p>' +
                            '<a href="' +
                            bookUrl +
                            '" target="_blank">' +
                            'View this book on Open Library' +
                            '</a>' +
                        '</p>' +

                    '</div>' +

                '</div>';

            $("#results").append(bookHtml);

        });

    }).fail(function() {

        $("#summary").html(
            "<p>Unable to load the search JSON file.</p>"
        );

    });

});
</script>

</body>
</html>
