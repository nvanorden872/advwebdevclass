<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exercise 2 - jQuery Events</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

            $("#button1").click(function() {
                $("#paragraph1").hide();
            });

            $("#button2").click(function() {
                $("#paragraph2").hide();
            });

        });
    </script>
</head>
<body>
    <h1>jQuery Event Handling</h1>

    <p id="paragraph1">This is the first paragraph.</p>
    <p id="paragraph2">This is the second paragraph.</p>

    <button id="button1" type="button">Hide First Paragraph</button>
    <button id="button2" type="button">Hide Second Paragraph</button>
</body>
</html>
